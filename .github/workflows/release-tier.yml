name: Release tier

# Section 6 assigns three cases to a tier that runs before every release rather than on every
# commit: one restarts the process to rotate the key ring, one removes an optional dependency, and
# one reads the packed artefact. None of them belongs in a blocking gate, and a tier without a
# schedule is a script nobody runs — which is what E-344 recorded and this closes.
# The tag trigger alone meant the tier's first run was after the merge that could break it, so a
# nightly schedule ran it before the tag (E-535). It stays out of the blocking gate for the reason
# E-526 gives. Since the publish moved to the maintainer's machine the tag arrives after the
# version is on the registry, so the tier also runs on every push to main, and the publish asks
# pnpm check:release-tier for a green run of this workflow on the exact commit it publishes
# (architecture 6.19, E-2763). The tag no longer triggers this file: release.yml runs the same
# tier over the tagged commit, and two runs of it per tag were one too many (E-2764).
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

jobs:
  release-tier:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: velve
          POSTGRES_USER: velve
          POSTGRES_DB: velve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VELVE_TEST_DATABASE_URL: postgres://velve:velve@localhost:5432/velve_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Release tier
        run: pnpm test:release
