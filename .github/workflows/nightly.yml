name: Nightly

# Section 6 puts the statistical and high-repetition cases on a nightly tier: they
# are too slow for every commit, and at p = 0.001 across many positions a family of
# them rejects a sound generator often enough to be noise in a blocking gate.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: velve
          POSTGRES_USER: velve
          POSTGRES_DB: velve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VELVE_TEST_DATABASE_URL: postgres://velve:velve@localhost:5432/velve_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Nightly tier
        run: pnpm test:nightly
