name: Nightly

# Section 6 puts the statistical and high-repetition cases on a nightly tier: they
# are too slow for every commit, and at p = 0.001 across many positions a family of
# them rejects a sound generator often enough to be noise in a blocking gate.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: velve
          POSTGRES_USER: velve
          POSTGRES_DB: velve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VELVE_TEST_DATABASE_URL: postgres://velve:velve@localhost:5432/velve_test
    steps:
      # A case of the unit project reads commits by name, which a shallow checkout does not
      # hold (E-3572).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The nightly tier runs the unit project, the acceptance case included, and that case fails
      # rather than skips without a provider. This file was the workflow E-1906's guard could not
      # see, and the tier went red on it every night (E-2900).
      - name: Start the provider the acceptance case signs in through
        run: ./tools/start-dex.sh

      - name: Nightly tier
        run: pnpm test:nightly

  # E-1841: the dependency audit was a point in time, and the next advisory against any of the six
  # would have arrived in silence. It runs here rather than in the gate deliberately: a moderate
  # finding in a development dependency should wake somebody, not block every pull request, and
  # `pnpm audit` reads a database that changes without this repository changing — a gate step whose
  # answer moves on its own turns an unrelated branch red for a reason its author cannot fix.
  #
  # It is a separate job so that a failing audit does not hide behind a failing tier, and reads
  # `--prod` first: a finding in what ships is a different thing from one in the toolchain, and the
  # two are reported apart rather than as one number (E-1845).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: What ships
        run: pnpm audit --prod

      # One advisory is ignored in package.json, against a package only a development dependency
      # reaches, and test/audit-exception.test.ts holds it to that and to its removal (E-2901).
      - name: What builds and tests it
        run: pnpm audit
