name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "26"]
    name: gate (node ${{ matrix.node }})
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: velve
          POSTGRES_USER: velve
          POSTGRES_DB: velve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VELVE_TEST_DATABASE_URL: postgres://velve:velve@localhost:5432/velve_test
    steps:
      # check:log-append and check:skill-version need the merge base with origin/main, and
      # refuse a run where it cannot be computed rather than passing (CLAUDE.md §6).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Reviewable text
        run: pnpm check:reviewable

      - name: Session owner reassignment
        run: pnpm check:session-owner

      - name: Lock order
        run: pnpm check:lock-order

      - name: SQL survives normalisation
        run: pnpm check:sql-collapse

      - name: The decision log only grows
        run: pnpm check:log-append

      - name: A changed skill raises its version
        run: pnpm check:skill-version

      - name: The Codex skill is generated, not written
        run: pnpm check:codex-skill

      - name: Dead code
        run: pnpm knip

      - name: Test
        run: pnpm test

      - name: Package exports
        run: pnpm publint

      - name: Type resolution
        run: pnpm attw

  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject AI attribution
        env:
          ASSISTANTS: 'Claude|Anthropic|ChatGPT|OpenAI|Copilot|Gemini|Codex'
        run: |
          set -uo pipefail

          # Files that must name the forbidden terms: the specification, this
          # detector, and the rule itself.
          EXEMPT=(':!VELVE-AUTH-ARCHITEKTUR.md' ':!.github/workflows/ci.yml' ':!CLAUDE.md')

          MARKERS="Co-authored-by:.*($ASSISTANTS)|noreply@(anthropic|openai)\\.com|Generated with|🤖|claude\\.ai/code|session_[0-9A-Za-z]{16}"
          CLAIMS="(written|generated|authored|created|produced|refactored)[[:space:]]+(by|with|using)[[:space:]]+(an?[[:space:]]+)?(AI|LLM|$ASSISTANTS)|AI-(generated|authored|written)|@author[[:space:]]+.*($ASSISTANTS)"

          fail=0
          SCAN_DIR=$(mktemp -d)

          # A scan that could not run must not be read as a scan that found nothing, so
          # it ends the job here instead of adding to `fail` and letting the summary
          # below report a clean tree.
          refuse() {
            echo "::error::$1"
            exit 1
          }

          # Each scan reads its surface into a file before searching it, so that the
          # producer's own exit status is visible and the size of what was read can be
          # printed rather than assumed.
          read_surface() {
            SCAN_NAME=$1
            SURFACE=$2
            shift 2
            if ! "$@" > "$SURFACE"; then
              refuse "the $SCAN_NAME scan could not read what it searches"
            fi
          }

          # A surface that came back empty is the second way a scan reports success
          # without having looked at anything. Two surfaces below are legitimately
          # empty and say so where they are read; every other one is empty only
          # because the repository could not be read.
          require_content() {
            if [ ! -s "$2" ]; then
              refuse "the $1 scan had nothing to search"
            fi
          }

          # awk and cmp report "could not look" through their exit status and "found
          # something" through their output, so they need the refusal without the
          # three-way reading `report` does for grep.
          refuse_unless_zero() {
            if [ "$2" -ne 0 ]; then
              refuse "the $1 scan could not run, so it proves nothing"
            fi
          }

          lines_in() {
            wc -l < "$1" | tr -d '[:space:]'
          }

          # `grep` exits 1 where it looked and matched nothing and 2 where it could not
          # look, and a producer that failed gives neither. `if <pipeline>; then` read
          # all three as one false condition, which is how a planted marker passed this
          # job with `git` removed from the PATH. The step runs under the default
          # `bash -e {0}`, so each status is taken with `|| VAR=$?` and not from a bare
          # command, which would end the job on the ordinary no-match exit.
          report() {
            SCAN_NAME=$1
            FINDING=$2
            GREP_STATUS=$3
            HITS=$4
            case "$GREP_STATUS" in
              0)
                echo "::error::$FINDING"
                cat "$HITS"
                fail=1
                ;;
              1) ;;
              *) refuse "the $SCAN_NAME scan could not run, so it proves nothing" ;;
            esac
          }

          RANGE="HEAD"
          if git rev-parse --verify -q origin/main >/dev/null; then
            if ! AHEAD=$(git rev-list --count origin/main..HEAD); then
              refuse "the commit range origin/main..HEAD could not be counted"
            fi
            # A range selecting no commit cannot be told from a range that could not be
            # read, so the branch range is taken only where the branch has commits of
            # its own, and the whole history is the surface otherwise.
            if [ "$AHEAD" -gt 0 ]; then
              RANGE="origin/main..HEAD"
            fi
          fi
          if ! COMMIT_COUNT=$(git rev-list --count "$RANGE"); then
            refuse "the commits in $RANGE could not be counted"
          fi
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            refuse "the range $RANGE selects no commit, so the history scans read nothing"
          fi

          # A symlink makes the content at a path differ from what a reviewer reads there.
          read_surface "symlink" "$SCAN_DIR/index" git ls-files -s
          require_content "symlink" "$SCAN_DIR/index"
          echo "Checking $(lines_in "$SCAN_DIR/index") tracked paths for symlinks"
          SYMLINK_STATUS=0
          awk '$1 == "120000" { $1=""; $2=""; $3=""; print }' "$SCAN_DIR/index" \
            > "$SCAN_DIR/symlink-hits" || SYMLINK_STATUS=$?
          refuse_unless_zero "symlink" "$SYMLINK_STATUS"
          if [ -s "$SCAN_DIR/symlink-hits" ]; then
            echo "::error::a tracked path is a symlink, so its content is not what review shows"
            cat "$SCAN_DIR/symlink-hits"
            fail=1
          fi

          # A repository with no .gitattributes at all is the wanted state, so this is
          # the first surface whose emptiness is an answer rather than a failure to look.
          # The paths are read into an array rather than piped through xargs, which
          # documents itself as reporting 123 for any invocation exiting 1 to 125 and so
          # returns one status for the no-match this scan expects and the error it must
          # refuse on.
          read_surface ".gitattributes" "$SCAN_DIR/attributes" \
            git ls-files --cached --others --exclude-standard -- '*.gitattributes'
          echo "Checking $(lines_in "$SCAN_DIR/attributes") .gitattributes files"
          if [ -s "$SCAN_DIR/attributes" ]; then
            ATTRIBUTE_FILES=()
            while IFS= read -r attribute_file; do
              ATTRIBUTE_FILES+=("$attribute_file")
            done < "$SCAN_DIR/attributes"
            ATTRIBUTE_STATUS=0
            grep -nE '(^|[[:space:]])(binary|-diff)([[:space:]]|$)' "${ATTRIBUTE_FILES[@]}" \
              > "$SCAN_DIR/attribute-hits" || ATTRIBUTE_STATUS=$?
            report ".gitattributes" \
              "a .gitattributes marks a path binary or -diff, which hides it from review" \
              "$ATTRIBUTE_STATUS" "$SCAN_DIR/attribute-hits"
          fi

          # A single NUL byte makes git classify a source file as binary, which hides
          # it from `git grep -I` and renders its diff as "Bin" in review.
          read_surface "NUL byte" "$SCAN_DIR/text-files" git ls-files -- . ':!assets/**'
          require_content "NUL byte" "$SCAN_DIR/text-files"
          echo "Checking $(lines_in "$SCAN_DIR/text-files") files for a NUL byte"
          # The loop is not a command substitution, because `refuse` inside one exits the
          # subshell and leaves the job running.
          : > "$SCAN_DIR/binary"
          while read -r text_file; do
            [ -f "$text_file" ] || continue
            COMPARISON_STATUS=0
            tr -d '\000' < "$text_file" | cmp -s - "$text_file" || COMPARISON_STATUS=$?
            case "$COMPARISON_STATUS" in
              0) ;;
              1) echo "$text_file" >> "$SCAN_DIR/binary" ;;
              *) refuse "the NUL byte scan could not read $text_file" ;;
            esac
          done < "$SCAN_DIR/text-files"
          if [ -s "$SCAN_DIR/binary" ]; then
            echo "::error::text files contain a NUL byte and escape review and scanning"
            cat "$SCAN_DIR/binary"
            fail=1
          fi

          read_surface "commit message" "$SCAN_DIR/messages" git log --format=%B "$RANGE"
          require_content "commit message" "$SCAN_DIR/messages"
          echo "Scanning $COMMIT_COUNT commit messages in $RANGE"
          MESSAGE_STATUS=0
          grep -Eani "$MARKERS|$CLAIMS" "$SCAN_DIR/messages" > "$SCAN_DIR/message-hits" \
            || MESSAGE_STATUS=$?
          report "commit message" "AI attribution found in commit messages" \
            "$MESSAGE_STATUS" "$SCAN_DIR/message-hits"

          read_surface "tree" "$SCAN_DIR/tracked" git ls-files -- . "${EXEMPT[@]}"
          require_content "tree" "$SCAN_DIR/tracked"
          echo "Scanning $(lines_in "$SCAN_DIR/tracked") tracked files"
          MARKER_STATUS=0
          git grep -Eani "$MARKERS" -- . "${EXEMPT[@]}" > "$SCAN_DIR/marker-hits" \
            || MARKER_STATUS=$?
          report "tree" "AI attribution marker found in tree" \
            "$MARKER_STATUS" "$SCAN_DIR/marker-hits"
          CLAIM_STATUS=0
          git grep -Eani "$CLAIMS" -- . "${EXEMPT[@]}" > "$SCAN_DIR/claim-hits" \
            || CLAIM_STATUS=$?
          report "tree" "AI authorship claim found in tree" \
            "$CLAIM_STATUS" "$SCAN_DIR/claim-hits"

          # The tree scan cannot see text that a later commit removed; the diff
          # scan cannot see text that predates the branch. Both are needed.
          # A branch whose every change is in an exempt path leaves this surface empty,
          # so it is the second one whose emptiness is an answer; what proves this scan
          # looked is the commit count of the range, which is checked above.
          read_surface "branch diff" "$SCAN_DIR/diff" \
            git log -p --text --format=%B "$RANGE" -- . "${EXEMPT[@]}"
          echo "Scanning $(wc -c < "$SCAN_DIR/diff" | tr -d '[:space:]') bytes of diff in $RANGE"
          DIFF_STATUS=0
          grep -Eani "$MARKERS|$CLAIMS" "$SCAN_DIR/diff" > "$SCAN_DIR/diff-hits" \
            || DIFF_STATUS=$?
          report "branch diff" "AI attribution found in the branch diff" \
            "$DIFF_STATUS" "$SCAN_DIR/diff-hits"

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "No AI attribution found"
