name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "26"]
    name: gate (node ${{ matrix.node }})
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: velve
          POSTGRES_USER: velve
          POSTGRES_DB: velve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VELVE_TEST_DATABASE_URL: postgres://velve:velve@localhost:5432/velve_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dead code
        run: pnpm knip

      - name: Test
        run: pnpm test

      - name: Package exports
        run: pnpm publint

      - name: Type resolution
        run: pnpm attw

  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject AI attribution
        run: |
          PATTERN='Co-Authored-By:.*(Claude|Anthropic|Copilot|ChatGPT|OpenAI)|Generated with|🤖|claude\.ai/code|AI-generated|Co-authored-by:.*noreply@anthropic'
          if git log --format=%B origin/main..HEAD 2>/dev/null | grep -Eiq "$PATTERN"; then
            echo "AI attribution found in commit messages"
            git log --format=%B origin/main..HEAD | grep -Ein "$PATTERN"
            exit 1
          fi
          if git grep -EIn "$PATTERN" -- . ':!VELVE-AUTH-ARCHITEKTUR.md' ':!.github/workflows/ci.yml' 2>/dev/null; then
            echo "AI attribution found in tree"
            exit 1
          fi
          echo "No AI attribution found"
