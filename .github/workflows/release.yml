name: Release

# A tag is the only thing that fires this. There is deliberately no workflow_dispatch: a run
# started without a tag has no name to compare package.json against, and check:release-tag
# refuses rather than guessing — so an entry point that cannot be checked is not offered.
#
# The jobs gate each other in the order the brief fixes: everything ci.yml runs, then the two
# tiers section 6 puts before a release, then the tag against the manifest, then the publish,
# then the registry. Nothing is published that has not been through all four.
on:
  push:
    tags: ["v*"]

# A publish is not interruptible half way through, so a second tag waits rather than cancelling
# the first — the opposite of ci.yml, where cancelling a superseded run is the point.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_URL: https://registry.npmjs.org

jobs:
  # The dist-tag follows from the version rather than being written down: a prerelease goes to
  # `next` and a stable version takes `latest`. It was the literal `next` until 1.0.0, which would
  # have published the stable line under the prerelease tag and left `latest` on the first
  # prerelease for good (E-1777). Decided once, in one job, because three copies of one line is
  # the drift E-1429 called out.
  #
  # The job id carries an underscore and not a hyphen. `needs.dist-tag.outputs.value` is not a
  # property access in an Actions expression — it parses as `needs.dist` minus `tag` — so it
  # evaluates to the empty string, every job stays green, and the value arrives nowhere (E-1880).
  dist_tag:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.decide.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm run <script>` and not `pnpm <script>`: pnpm prefers its own subcommand over a package
      # script of the same name and says nothing, so `pnpm dist-tag` ran pnpm's registry query and
      # the tool never executed (E-1881). The script is named so it collides with nothing either.
      #
      # The step writes $GITHUB_OUTPUT from inside the tool, so a refusal is this step's exit
      # status. `echo "value=$(pnpm dist-tag)"` would exit zero on a refusal and pass an empty
      # tag to the publish, which is the hazard CLAUDE.md section 5 names.
      - name: Decide the dist-tag from the version
        id: decide
        run: pnpm run release-dist-tag

  # ci.yml is called rather than copied, so "the whole gate" is the same definition and not a
  # second one that drifts — and its attribution job runs at publish time, which it would not
  # otherwise, because a tag ref matches neither of ci.yml's own triggers. A release that skips
  # a check the ordinary pull request runs is worse than no workflow (E-1429).
  ci:
    uses: ./.github/workflows/ci.yml

  # Section 6 puts the statistical cases on a nightly schedule and three further cases before
  # every release. This is that release moment, so both run here rather than only on their
  # schedules — a tier whose last run was hours ago has not seen this tree.
  tiers:
    needs: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: velve
          POSTGRES_USER: velve
          POSTGRES_DB: velve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VELVE_TEST_DATABASE_URL: postgres://velve:velve@localhost:5432/velve_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Nightly tier
        run: pnpm test:nightly
      - name: Release tier
        run: pnpm test:release

  # A tag saying one version over a tree saying another publishes the wrong artefact under the
  # right name, and nothing else in this repository reads the version at all.
  version:
    needs: [tiers, dist_tag]
    runs-on: ubuntu-latest
    env:
      DIST_TAG: ${{ needs.dist_tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag and package.json agree
        run: pnpm check:release-tag "$GITHUB_REF_NAME" "$DIST_TAG"

      # The one rehearsal of the publish that costs nothing and needs no credential. It packs
      # what would be uploaded and refuses a manifest npm will not accept, here rather than
      # after the gate and both tiers have run.
      - run: pnpm build
      - name: Rehearse the publish
        run: npm publish --dry-run --provenance --access public --tag "$DIST_TAG"

  publish:
    needs: [version, dist_tag]
    runs-on: ubuntu-latest
    env:
      DIST_TAG: ${{ needs.dist_tag.outputs.value }}
    permissions:
      contents: read
      # npm mints the provenance attestation from this token, and it is what trusted publishing
      # will authenticate with when NODE_AUTH_TOKEN below is deleted.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: ${{ env.REGISTRY_URL }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # npm's provenance documentation requires 9.5.0 or newer; the version that actually ran is
      # recorded rather than assumed from whatever the Node image happened to carry.
      - name: Record the npm version that publishes
        run: npm --version

      # The scope is private by default, so the first publish of it has to say public; npm's
      # documentation states that requirement in the provenance context.
      #
      # NODE_AUTH_TOKEN is the only credential this workflow names, and it is transitional. The
      # npm CLI prefers a detected OIDC environment over a token, so registering a trusted
      # publisher for this package makes these two lines inert, and the migration is their
      # deletion followed by revoking the token (E-1416).
      - name: Publish to npm
        run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The publish step exiting zero is not the version being resolvable, which is the step people
  # leave out. This asks the registry for the version, for the dist-tag and for the attestation.
  verify:
    needs: [publish, dist_tag]
    runs-on: ubuntu-latest
    env:
      DIST_TAG: ${{ needs.dist_tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: The registry resolves what was published
        run: pnpm check:published-version "$DIST_TAG"
