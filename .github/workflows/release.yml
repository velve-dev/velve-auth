name: Release

# A tag is the only thing that fires this. There is deliberately no workflow_dispatch: a run
# started without a tag has no name to compare package.json against, and check:release-tag
# refuses rather than guessing — so an entry point that cannot be checked is not offered.
#
# Nothing here publishes. The maintainer publishes from their own machine, so that no registry
# credential is stored on GitHub, and pushes the tag afterwards (E-2760). What a tag still runs is
# the verification of the tagged tree: everything ci.yml runs, then the two tiers section 6 puts
# before a release, then the tag against the manifest. Because it runs after the publish, it
# reports a published version rather than blocking one. What blocks the publish runs on the
# maintainer's machine: the release tier's green run on the commit, read from release-tier.yml's
# run on main, the rehearsal of the publish, and afterwards the registry check (E-2763).
on:
  push:
    tags: ["v*"]

# A run over a tag is the record of that release, so a second tag waits rather than cancelling the
# first — the opposite of ci.yml, where cancelling a superseded run is the point.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The dist-tag follows from the version rather than being written down: a prerelease goes to
  # `next` and a stable version takes `latest`. It was the literal `next` until 1.0.0, which would
  # have published the stable line under the prerelease tag and left `latest` on the first
  # prerelease for good (E-1777). Decided by the same script the maintainer's machine runs before
  # the publish, so the tag check here and the publish there read one derivation and not two
  # copies of it, which is the drift E-1429 called out (E-2766).
  #
  # The job id carries an underscore and not a hyphen. `needs.dist-tag.outputs.value` is not a
  # property access in an Actions expression — it parses as `needs.dist` minus `tag` — so it
  # evaluates to the empty string, every job stays green, and the value arrives nowhere (E-1880).
  dist_tag:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.decide.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm run <script>` and not `pnpm <script>`: pnpm prefers its own subcommand over a package
      # script of the same name and says nothing, so `pnpm dist-tag` ran pnpm's registry query and
      # the tool never executed (E-1881). The script is named so it collides with nothing either.
      #
      # The step writes $GITHUB_OUTPUT from inside the tool, so a refusal is this step's exit
      # status. `echo "value=$(pnpm dist-tag)"` would exit zero on a refusal and pass an empty
      # tag to the check, which is the hazard CLAUDE.md section 5 names.
      - name: Decide the dist-tag from the version
        id: decide
        run: pnpm run release-dist-tag

  # ci.yml is called rather than copied, so "the whole gate" is the same definition and not a
  # second one that drifts — and its attribution job runs on the tag, which it would not
  # otherwise, because a tag ref matches neither of ci.yml's own triggers. A release that skips
  # a check the ordinary pull request runs is worse than no workflow (E-1429).
  ci:
    uses: ./.github/workflows/ci.yml

  # Section 6 puts the statistical cases on a nightly schedule and three further cases before
  # every release. The release tier has already passed on this commit before the publish, on its
  # push to main; both tiers run again here over the tagged tree, so the nightly one is run on the
  # released commit too and the record of the release holds both (E-2764).
  tiers:
    needs: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: velve
          POSTGRES_USER: velve
          POSTGRES_DB: velve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VELVE_TEST_DATABASE_URL: postgres://velve:velve@localhost:5432/velve_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The tiers run the whole suite, the acceptance case included, so the provider has to be
      # here as well as in the gate — it was in one and not the other, and the release found it
      # (E-1906).
      - name: Start the provider the acceptance case signs in through
        run: ./tools/start-dex.sh

      - name: Nightly tier
        run: pnpm test:nightly
      - name: Release tier
        run: pnpm test:release

  # A tag saying one version over a tree saying another publishes the wrong artefact under the
  # right name, and nothing else in this repository reads the version at all.
  #
  # No rehearsal of the publish follows the check. The tag arrives after the version is on the
  # registry, and the npm this workflow runs refuses a dry run over a version already published,
  # so the rehearsal runs on the maintainer's machine before the publish instead (E-2762).
  version:
    needs: [tiers, dist_tag]
    runs-on: ubuntu-latest
    env:
      DIST_TAG: ${{ needs.dist_tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag and package.json agree
        run: pnpm check:release-tag "$GITHUB_REF_NAME" "$DIST_TAG"
